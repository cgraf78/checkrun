name: Refresh Mise lock

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-mise-lock
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve current tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.refresh.outputs.base_sha }}
      changed: ${{ steps.refresh.outputs.changed }}
      lock: ${{ steps.refresh.outputs.lock }}
    env:
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/.github/mise/checkrun-ci.toml
      MISE_GLOBAL_CONFIG_ROOT: ${{ github.workspace }}/.github/mise
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_SAFE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.11
          install: false
          cache: false

      - name: Refresh lockfile
        id: refresh
        shell: bash
        run: |
          set -euo pipefail

          # Regenerate from the manifest so fuzzy selectors resolve anew and
          # removed tools cannot survive as stale lock entries.
          : >.github/mise/mise.lock
          mise lock --global
          python3 .github/scripts/verify_mise_lock.py \
            .github/mise/checkrun-ci.toml .github/mise/mise.lock

          if git diff --quiet -- .github/mise/mise.lock; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
          echo "base_sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          echo "lock=$(base64 <.github/mise/mise.lock | tr -d '\n')" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish toolchain update
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions: # zizmor: ignore[excessive-permissions]
      contents: write # Push the automation branch and request auto-merge.
      pull-requests: write # Create or update the dedicated refresh PR.
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_SHA: ${{ needs.refresh.outputs.base_sha }}
      GH_TOKEN: ${{ github.token }}
      LOCK_CONTENT: ${{ needs.refresh.outputs.lock }}
      UPDATE_BRANCH: automation/mise-lock-refresh
    steps:
      - name: Require the repository-scoped deploy key
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.CHECKRUN_MISE_REFRESH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "CHECKRUN_MISE_REFRESH_DEPLOY_KEY is not configured" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repository-only key makes the post-PR push a real synchronize
          # event, attaching protected pull_request checks to the final commit.
          ssh-key: ${{ secrets.CHECKRUN_MISE_REFRESH_DEPLOY_KEY }}
          token: unused-by-ssh-checkout
          persist-credentials: true # zizmor: ignore[artipacked]
          path: repo
          ref: ${{ needs.refresh.outputs.base_sha }}

      - name: Publish update branch
        shell: bash
        run: |
          set -euo pipefail

          latest_base="$(gh api "repos/$GITHUB_REPOSITORY/branches/$BASE_BRANCH" \
            --jq .commit.sha)"
          if [[ "$latest_base" != "$BASE_SHA" ]]; then
            echo "default branch changed during lock resolution; rerun the workflow" >&2
            exit 1
          fi

          cd repo
          printf '%s' "$LOCK_CONTENT" | base64 --decode >.github/mise/mise.lock

          remote_ref="refs/heads/$UPDATE_BRANCH"
          remote_sha="$(git ls-remote --heads origin "$remote_ref" | awk '{print $1}')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add .github/mise/mise.lock
          git commit -m "Stage refreshed Checkrun mise lock"

          if [[ -n "$remote_sha" ]]; then
            git push origin "HEAD:$remote_ref" \
              "--force-with-lease=$remote_ref:$remote_sha"
          else
            git push origin "HEAD:$remote_ref"
          fi

      - name: Open pull request and enable auto-merge
        shell: bash
        run: |-
          set -euo pipefail
          cd repo
          remote_ref="refs/heads/$UPDATE_BRANCH"

          body="$RUNNER_TEMP/mise-lock-pr.md"
          cat >"$body" <<'EOF'
          Refresh the committed Checkrun CI toolchain lock so routine test runs
          continue using reviewed versions and URLs, with checksums when the
          tool backend publishes them.

          Summary

          - re-resolve all fuzzy tool selectors from `checkrun-ci.toml`
          - regenerate Linux and macOS lock entries from one manifest
          - auto-merge only after the normal protected Checkrun matrix passes

          Testing

          - `.github/scripts/verify_mise_lock.py`
          - full protected Checkrun CI matrix on the final automation commit
          EOF

          owner=${GITHUB_REPOSITORY%%/*}
          head="$owner:$UPDATE_BRANCH"
          prs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f "head=$head" -f per_page=2)
          count=$(jq 'length' <<<"$prs")
          if ((count > 1)); then
            echo "multiple open Mise refresh PRs for $head" >&2
            exit 1
          fi

          if ((count == 0)); then
            gh pr create --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" \
              --title "Refresh Checkrun's \`mise\` toolchain" --body-file "$body"
            prs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open -f "head=$head" -f per_page=2)
            count=$(jq 'length' <<<"$prs")
          fi
          if ((count != 1)); then
            echo "expected exactly one open Mise refresh PR for $head" >&2
            exit 1
          fi

          number=$(jq -r '.[0].number' <<<"$prs")
          base=$(jq -r '.[0].base.ref' <<<"$prs")
          head_repo=$(jq -r '.[0].head.repo.full_name' <<<"$prs")
          head_ref=$(jq -r '.[0].head.ref' <<<"$prs")
          if [[ "$base" != "$BASE_BRANCH" ]]; then
            echo "unexpected base on Mise refresh PR #$number: $base" >&2
            exit 1
          fi
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "unexpected head repository on Mise refresh PR #$number: $head_repo" >&2
            exit 1
          fi
          if [[ "$head_ref" != "$UPDATE_BRANCH" ]]; then
            echo "unexpected head branch on Mise refresh PR #$number: $head_ref" >&2
            exit 1
          fi
          gh pr edit "$number" --title "Refresh Checkrun's \`mise\` toolchain" \
            --body-file "$body"

          # GITHUB_TOKEN-created PR events do not start another workflow. Amend
          # the staged commit after the PR exists and push it with the scoped
          # deploy key retained by checkout. That synchronize event starts the
          # protected pull_request matrix on the final tree.
          published_sha=$(git rev-parse HEAD)
          git commit --amend -F - <<'EOF'
          Refresh Checkrun's `mise` toolchain

          Summary

          Regenerate the committed CI tool lock so Checkrun can evaluate current
          formatter and linter releases without making ordinary CI mutable.

          Testing

          - `.github/scripts/verify_mise_lock.py`
          - full protected Checkrun CI matrix
          EOF
          git push origin "HEAD:$remote_ref" \
            "--force-with-lease=$remote_ref:$published_sha"

          gh pr merge "$number" --auto --squash
