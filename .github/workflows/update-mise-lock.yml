name: Refresh Mise lock

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    name: Refresh Checkrun Mise lock
    permissions:
      contents: write
      pull-requests: write
    uses: cgraf78/actions/.github/workflows/mise-lock-refresh.yml@de3f6086e36a77eec8ee62f2c9871266e4b5c05c
    with:
      project_name: Checkrun
      mise_config_file: .github/mise/checkrun-ci.toml
      mise_lock_file: .github/mise/mise.lock
      verify_command: python3 .github/scripts/verify_mise_lock.py .github/mise/checkrun-ci.toml .github/mise/mise.lock
    secrets:
      deploy_key: ${{ secrets.CHECKRUN_MISE_REFRESH_DEPLOY_KEY }}
