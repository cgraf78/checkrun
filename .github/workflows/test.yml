name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    # Delegates to the shared shell-ci reusable workflow, which sets up mise
    # (per .github/mise/checkrun-ci.toml), installs checkrun's own deps, then
    # runs the test-command argument. Reviewing CI coverage without leaving
    # this repo is intentional: any change to that workflow shows up here as a
    # SHA bump rather than as silent drift on a mutable branch.
    # To update the pin, run locally:
    #   gh api repos/cgraf78/actions/branches/main --jq '.commit.sha'
    # and replace the ref below (form: `...@<40-char-sha>`).
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@f9a9074b2d43fb3812067477d29307ef1e84e70e
    with:
      concurrency-scope: shell
      matrix-set: full
      profiles: base,python
      setup: checkrun
      shellcheck-inventory-path: test/shellcheck-files.txt
      test-command: CHECKRUN_SKIP_SHELLCHECK_SUITES=1 test/checkrun-test
      termux-command: |-
        test/suites/path-policy-test
        test/suites/registry-test
        CHECKRUN_HOOK_PERF_STRUCTURAL_ONLY=1 test/suites/hook-performance-test

  shellcheck:
    # Keep the previous required context during the branch-protection
    # transition. It is removed only after the main shell aggregate proves that
    # its shared inventory leaf is green. This profile path also keeps the
    # repository-owned suites on Alpine, where named Checkrun setup skips Mise.
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@f9a9074b2d43fb3812067477d29307ef1e84e70e
    with:
      concurrency-scope: shellcheck
      matrix-set: full
      profiles: base,shellcheck
      test-command: test/suites/shellcheck-inventory-test && test/suites/shellcheck-test
