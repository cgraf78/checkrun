name: Tests

on:
  push:
    # main is the only maintained branch. Keep this trigger aligned with the
    # protected default branch so retired aliases cannot hide CI drift.
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices do not compete
    # for the same runner capacity at the top of the hour.
    - cron: "27 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    # Delegates to the shared shell-ci reusable workflow, which sets up mise
    # (per .github/mise/checkrun-ci.toml), installs checkrun's own deps, then
    # runs the test-command argument. Reviewing CI coverage without leaving
    # this repo is intentional: any change to that workflow shows up here as a
    # SHA bump rather than as silent drift on a mutable branch.
    # The ref is generated from .github/cgraf78-actions.lock by the provider's
    # consumer-ci/sync.sh; do not update this literal independently.
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@53b11877db22bac7c070abc200c03e8991408389
    with:
      concurrency-scope: shell
      matrix-set: full
      profiles: base,python
      setup: checkrun
      shellcheck-inventory-path: test/shellcheck-files.txt
      test-command: test/checkrun-test
      termux-command: |-
        set -euo pipefail
        test/suites/install-test
        test/suites/path-policy-test
        test/suites/registry-test
        CHECKRUN_HOOK_PERF_STRUCTURAL_ONLY=1 test/suites/hook-performance-test

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This gate
      # verifies every unavoidable cgraf78/actions literal still matches that
      # single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@53b11877db22bac7c070abc200c03e8991408389
