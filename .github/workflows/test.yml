name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    # Delegates to the shared shell-ci reusable workflow, which sets up mise
    # (per .github/mise/checkrun-ci.toml), installs checkrun's own deps, then
    # runs the test-command argument. Reviewing CI coverage without leaving
    # this repo is intentional: any change to that workflow shows up here as a
    # SHA bump rather than as silent drift on a mutable branch.
    # To update the pin, run locally:
    #   gh api repos/cgraf78/actions/branches/main --jq '.commit.sha'
    # and replace the ref below (form: `...@<40-char-sha>`).
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@6258122bd79dc9296b5d529c33fc3aad8f4d5796
    with:
      concurrency-scope: shell
      matrix-set: full
      profiles: base,python
      setup: checkrun
      shellcheck-inventory-path: test/shellcheck-files.txt
      test-command: test/checkrun-test
      termux-command: |-
        test/suites/path-policy-test
        test/suites/registry-test
        CHECKRUN_HOOK_PERF_STRUCTURAL_ONLY=1 test/suites/hook-performance-test
